# OpenAI Agents SDK Configuration for gis-dev-workflow
# Version: 1.1.0
# Compatible with: openai-agents >= 0.1.0

name: gis-dev-workflow
version: 1.1.0
type: multi-stage-workflow
description: |
  Vue 3 + TypeScript + OpenLayers/ThreeJS GIS 前端工程分阶段开发工作流。
  按 analysis → design → planning → implementation → test 五阶段严格推进。
  默认基线对齐五层架构 (Service→Protocol→Calc→Ctrl→Render) 与 WGS84 坐标硬约束。

# ===== Agent 元信息 =====
agent:
  name: gis-frontend-architect
  description: |
    GIS 前端架构师，严格遵守五层架构与硬约束。
    所有业务控制层方法必须经过 protectInvariants 校验。
  instructions: |
    你是 GIS 前端架构师，遵循以下原则：

    1. 五层架构：Service → Protocol → Calc → Ctrl → Render
    2. 业务控制层（6 个：Alarm/Call/Config/Dispatch/Duty/Tracking）只装配业务参数
    3. 通用控制层（4 个：Geometry/Kinematic/Spatial/View）只执行图形指令
    4. IO 控制层（2 个：Input/Output）只做事件转发
    5. 严禁越层调用（业务控制层禁止直接调 OpenLayers / ThreeJS）

    硬约束：
    - 坐标系强约束 WGS84
    - 业务 ID 前缀：alarm_/call_/route_/plan_/vehicle_/trail_
    - Auto-Fit Padding 10-15%
    - 状态机迁移严格按 docs/source/08-业务状态机定义.md
    - 高频数据走 Web Worker + Transferable Objects

    性能 SLA：
    - 帧率 ≥ 30fps（P95）
    - 来电弹屏 ≤ 500ms
    - 调派算路 ≤ 1s（P95）
    - 测试覆盖率 ≥ 80%
    - 综合评分 ≥ 80 分

# ===== 工作流阶段 =====
stages:
  - id: gis-analysis
    name: 分析
    order: 1
    skill_path: skills/gis-analysis/SKILL.md
    instructions: |
      把 docs/source/** 与 mds/** 资料按五层分层，输出 docs/analysis/01-五层索引目录.md。
      每份资料标注强/中/弱/不相关四档。

  - id: gis-design
    name: 设计
    order: 2
    skill_path: skills/gis-design/SKILL.md
    instructions: |
      产出七份设计文档：00-设计总览、01-业务域、02-协议层、03-控制层、04-渲染层、05-状态机、06-异常与降级。
      必须字段级 + 方法级。引用 references/* 全部相关章节。

  - id: gis-planning
    name: 计划
    order: 3
    skill_path: skills/gis-planning/SKILL.md
    instructions: |
      产出六份可执行计划：00-计划总览、01-Service与Protocol、02-Calc、03-Ctrl业务、04-Ctrl通用、05-Ctrl-IO与Render、06-测试与验收。
      不允许出现 TODO、TBD、待补充、TBC。

  - id: gis-implementation
    name: 实现
    order: 4
    skill_path: skills/gis-implementation/SKILL.md
    instructions: |
      按 Service → Protocol → Calc → Ctrl → Render 顺序实现。
      任何实现步骤先有失败测试，再写生产代码。
      通过 pnpm type-check / lint / test（覆盖率 ≥ 80%）。

  - id: gis-test
    name: 测试
    order: 5
    skill_path: skills/gis-test/SKILL.md
    instructions: |
      Playwright 端到端 + 性能基准 + 综合评分。
      生成 tests/report/final-acceptance.md。

# ===== 配套技能 =====
companions:
  - id: handover-doc
    name: 项目交接
    skill_path: skills/handover-doc/SKILL.md
    callable_after_any_stage: true

# ===== 工具定义 =====
tools:
  - name: read_documentation
    type: function
    file: tools/read_documentation.json
  - name: write_stage_artifact
    type: function
    file: tools/write_stage_artifact.json
  - name: run_quality_gate
    type: function
    file: tools/run_quality_gate.json
  - name: invoke_superpowers
    type: function
    file: tools/invoke_superpowers.json

# ===== 上下文配置 =====
context:
  repository_root: d:/work/telewave/ids/ids-gis-web
  single_source_of_truth: docs/source/
  legacy_docs: mds/

# ===== 兼容性 =====
compatibility:
  codex: true
  hermes: true
  claude_code: true
  cursor: true
  trae: true
  openai_agents: true
