# Hermes Agent Configuration for gis-dev-workflow
# Version: 1.2.0
# Compatible with: Hermes Agent >= 0.5.x

name: gis-dev-workflow
version: 1.2.0
type: multi-stage-workflow
language: zh-CN
description: |
  Vue 3 + TypeScript + OpenLayers/ThreeJS GIS 前端工程分阶段开发工作流。
  严格按 analysis → design → planning → implementation → test 五阶段推进。
  内置 Harness Engineering 12 项核心要素：渐进式披露、失败恢复、Token 预算、信任校准、自我反思、决策树、反模式目录。

# ===== Agent 元信息 =====
agent:
  role: gis-frontend-architect
  persona: |
    你是一名 GIS 前端架构师，严格遵守五层架构（Service→Protocol→Calc→Ctrl→Render），
    所有业务控制层方法必须经过 protectInvariants 校验，
    所有图元 ID 必须加业务前缀，所有视野切换必须保留 10-15% Padding。
  tone: professional-and-precise
  constraints:
    - 业务控制层禁止直接调 OpenLayers / ThreeJS
    - 通用控制层禁止读业务 store
    - 状态机迁移必须符合 docs/source/08-业务状态机定义.md 的有向边
    - 坐标系强约束 WGS84
    - 任何业务操作必须经过完整链路（protectInvariants → decision → stateMachine.transit → protocolLayer.publish）
    - 高频数据（GPS、轨迹）必须走 Web Worker + Transferable Objects

# ===== 渐进式披露 (Progressive Disclosure) =====
progressive_disclosure:
  enabled: true
  strategy: load_required_only
  description: 每个阶段只加载 loadRequired 中的 references，其余按需 deferred
  token_saving_estimate: 30-40%
  stage_loads:
    gis-analysis:
      required: [workflow-contract, gis-architecture]
      optional: [gis-business-scenarios]
      deferred: [vue3-conventions, gis-controller-patterns, gis-performance-sla, gis-state-machines, component-usage, handover-template, anti-patterns, decision-trees]
    gis-design:
      required: [workflow-contract, gis-architecture, gis-controller-patterns, gis-state-machines]
      optional: [gis-coord-system, gis-business-scenarios, anti-patterns]
      deferred: [vue3-conventions, gis-performance-sla, component-usage, handover-template, decision-trees]
    gis-planning:
      required: [workflow-contract, gis-controller-patterns, gis-state-machines, anti-patterns]
      optional: [gis-coord-system, gis-performance-sla, decision-trees]
      deferred: [vue3-conventions, component-usage, handover-template]
    gis-implementation:
      required: [vue3-conventions, gis-architecture, gis-coord-system, gis-controller-patterns, gis-state-machines, anti-patterns, component-usage]
      optional: [gis-performance-sla, decision-trees]
      deferred: [handover-template]
    gis-test:
      required: [gis-performance-sla, gis-architecture]
      optional: [gis-business-scenarios, anti-patterns, decision-trees]
      deferred: [vue3-conventions, gis-controller-patterns, gis-state-machines, component-usage, handover-template]
    handover-doc:
      required: [handover-template, workflow-contract]
      optional: [gis-architecture]
      deferred: [vue3-conventions, gis-coord-system, gis-business-scenarios, gis-performance-sla, gis-controller-patterns, gis-state-machines, component-usage, anti-patterns, decision-trees]

# ===== 失败恢复策略 (Failure Recovery) =====
failure_recovery:
  enabled: true
  default_on_exhausted: halt_and_ask_user
  policies:
    COORD_VIOLATION:
      retry: 0
      on_exhausted: halt_and_ask_user
      fallback_message: "检测到非 WGS84 坐标。已阻断渲染并打点 P0，请提供正确坐标或修复源头。"
      notify: [backend, devops]
      recovery_time_seconds: null

    ILLEGAL_TRANSITION:
      retry: 0
      on_exhausted: rollback_to_previous_state
      fallback_message: "状态机迁移非法。已回滚到 {previousState} 并打点 P1。"
      notify: [shift_leader]
      recovery_time_seconds: null

    ROUTE_FALLBACK:
      retry: 2
      on_exhausted: use_straight_line
      fallback_message: "算路失败，已降级为直线段（{vehicleCount} 辆车）。"
      notify: []
      recovery_time_seconds: null
      fallback_payload:
        geometry_type: line
        use_vehicle_position: true

    GPS_LOST:
      retry: 1
      on_exhausted: keep_last_position
      fallback_message: "车辆 {vehicleId} GPS 丢失超过 30s，保留最后位置。"
      notify: []
      recovery_time_seconds: 30

    FOCUS_CONFLICT:
      retry: 0
      on_exhausted: priority_arbitration
      fallback_message: "焦点冲突，已按优先级裁决：{winner}。{loser} 被丢弃。"
      notify: []
      recovery_time_seconds: null

    ID_PREFIX_MISSING:
      retry: 0
      on_exhausted: block_publish
      fallback_message: "图元 ID 缺失业务前缀，已阻断发布。开发修复后重试。"
      notify: [developer]
      recovery_time_seconds: null

    PADDING_AUTO_FIX:
      retry: 0
      on_exhausted: auto_correct
      fallback_message: "Auto-Fit Padding 缺失，已自动修正为 10%~15%。"
      notify: []
      recovery_time_seconds: null

    VIEW_OUT_OF_BOUNDS:
      retry: 0
      on_exhausted: fit_to_center
      fallback_message: "视野越界，已重新 fitToCenter。"
      notify: []
      recovery_time_seconds: null

    FENCE_OUT_OF_RANGE:
      retry: 0
      on_exhausted: fit_to_valid_range
      fallback_message: "围栏越界，已重新 fitToValidRange。"
      notify: []
      recovery_time_seconds: null

    WORKER_DEGRADED:
      retry: 1
      on_exhausted: fallback_to_sync
      fallback_message: "Web Worker 异常，已切换为同步计算。性能可能下降。"
      notify: [sre]
      recovery_time_seconds: 60

    TRACKING_OVER_LIMIT:
      retry: 0
      on_exhausted: aggregate_render
      fallback_message: "跟踪车辆超过 50 辆，已切换为聚合渲染（热力图）。"
      notify: []
      recovery_time_seconds: null

    CALL_QUEUE_OVERFLOW:
      retry: 0
      on_exhausted: enqueue
      fallback_message: "同时来电超过 3 路，已进入排队。"
      notify: []
      recovery_time_seconds: null

    PROTO_DESERIALIZE_FAIL:
      retry: 0
      on_exhausted: discard_and_log
      fallback_message: "协议反序列化失败，已丢弃消息并打点 P0。"
      notify: [backend, devops, sre]
      recovery_time_seconds: null

    RESOURCE_LEAK:
      retry: 1
      on_exhausted: force_cleanup
      fallback_message: "资源回收失败，已强制清理并打点 P1。"
      notify: [developer]
      recovery_time_seconds: null

    PERMISSION_DENIED:
      retry: 0
      on_exhausted: reject_operation
      fallback_message: "权限不足，操作已拒绝。"
      notify: []
      recovery_time_seconds: null

# ===== Token 预算管理 (Token Budget) =====
token_budget:
  enabled: true
  total_per_session: 200000
  warning_thresholds:
    on_80_percent: warn
    on_95_percent: force_checkpoint
    on_100_percent: halt_and_resume
  per_stage:
    gis-analysis:
      budget: 30000
      reserved: 5000
      monitoring: standard
    gis-design:
      budget: 80000
      reserved: 10000
      monitoring: enhanced
    gis-planning:
      budget: 40000
      reserved: 5000
      monitoring: standard
    gis-implementation:
      budget: 50000
      reserved: 10000
      monitoring: enhanced
    gis-test:
      budget: 30000
      reserved: 5000
      monitoring: standard
    handover-doc:
      budget: 20000
      reserved: 3000
      monitoring: lightweight
  optimizations:
    - 引用 docs/source/** 而非重复输出
    - 使用 Mermaid 表达流程图（比纯文字更省 Token）
    - 大文件分块读取，避免一次性全量
    - 复用 superpowers 技能，避免重复 prompt

# ===== 信任校准 (Trust Levels) =====
trust_levels:
  enabled: true
  description: 校准 Agent 自主决策边界，区分"完全自主 / 建议 / 确认 / 硬停止"
  levels:
    L0_full_auto:
      description: Agent 完全自主，无需用户批准
      actions: [read_documentation, internal_query]
      approval: none
      examples: [读取文档、查询类操作]

    L1_suggest:
      description: Agent 建议，用户批准
      actions: [write_stage_artifact]
      approval: user_required
      approval_format: "请审阅 {artifact_path}，回复'已审阅'或具体修改意见。"
      examples: [写入设计文档、写入计划文档]

    L2_confirm:
      description: Agent 提议，用户预批
      actions: [run_quality_gate, invoke_superpowers]
      approval: user_pre_approval
      approval_format: "即将运行 {command}，是否继续？"
      examples: [运行 type-check、调用 TDD]

    L3_halt:
      description: Agent 必须停下
      actions: [delete_file, git_push, schema_migration, config_change]
      approval: hard_halt
      approval_format: "高危操作 {action} 已停止。需用户在终端手动执行。"
      examples: [删除 mds/、git push --force、协议 schema 升级]

  default_trust_level: L1_suggest
  stage_trust_levels:
    gis-analysis: L1_suggest
    gis-design: L1_suggest
    gis-planning: L1_suggest
    gis-implementation: L2_confirm
    gis-test: L2_confirm
    handover-doc: L1_suggest

# ===== 自我反思 (Self-Reflection) =====
self_reflection:
  enabled: true
  description: 每阶段产出自检报告，确保门禁通过
  trigger: after_each_stage
  output_section: "§10-自检报告"
  questions:
    gis-analysis:
      - "本阶段是否覆盖了 docs/source/ 全部 15 份文档？"
      - "每份资料是否标注了强/中/弱/不相关四档？"
      - "五层索引目录是否引用了 references/gis-architecture.md？"
      - "是否触发了任何 hard_constraints？"
      - "是否产生了 TODO/TBD/待补充？"
    gis-design:
      - "七份设计文档是否字段级 + 方法级？"
      - "业务/通用/IO 协议字段是否可逐字段追踪到 协议层DTO Schema.tsd？"
      - "5 个核心场景 AC 是否全部映射到设计产物？"
      - "性能 SLA 是否映射到具体设计？"
      - "状态机定义是否与业务控制层方法一一对应？"
      - "业务不变量校验是否在设计阶段定义？"
      - "异常处理是否在设计阶段定义？"
    gis-planning:
      - "六份计划是否可追溯到对应设计文档？"
      - "每份计划是否含可执行步骤、文件范围、测试要求、验收标准？"
      - "是否彻底消除了 TODO/TBD/待补充/TBC？"
      - "references/* 适用于当前层级的规则是否已转换为实现步骤？"
      - "性能 SLA 验收点是否已转换为基准测试要求？"
    gis-implementation:
      - "每个实现步骤是否先有失败测试再写生产代码？"
      - "GPS ≥ 2fps 高频数据是否走 Web Worker + Transferable Objects？"
      - "业务控制层方法是否可注入 genericController mock？"
      - "通用控制层方法是否可注入 store mock？"
      - "业务控制层方法命名是否符合'业务动词 + 业务名词'？"
      - "业务 ID 是否加业务前缀？"
      - "Auto-Fit 是否保留 10-15% Padding？"
      - "覆盖率是否 ≥ 80%？"
      - "是否触发了 anti-patterns 中的任何一条？"
    gis-test:
      - "5 个核心场景 AC 是否全部通过？"
      - "性能 SLA 是否全部达标？"
      - "综合评分是否 ≥ 80 分？"
      - "状态机合法/非法迁移是否全部测试？"
      - "异常降级是否全部测试？"
      - "严禁事项清单是否无违反？"
      - "WGS84 责任分工是否无违反？"
      - "业务/通用 DTO 是否严格分离？"

# ===== 成本与延迟预算 (Cost & Latency Budget) =====
cost_latency_budget:
  enabled: true
  currency: CNY
  per_stage:
    gis-analysis:
      token: 30000
      time_hours: 2
      cost_yuan: 0.5
    gis-design:
      token: 80000
      time_hours: 120  # 5d
      cost_yuan: 2.0
    gis-planning:
      token: 40000
      time_hours: 48  # 2d
      cost_yuan: 1.0
    gis-implementation:
      token: 50000
      time_hours: 240  # 10d
      cost_yuan: 3.0
    gis-test:
      token: 30000
      time_hours: 48  # 2d
      cost_yuan: 1.0
    handover-doc:
      token: 20000
      time_hours: 24
      cost_yuan: 0.5
  total:
    token: 250000
    time_hours: 482
    cost_yuan: 8.0
  monitoring:
    on_overrun_20_percent: warn
    on_overrun_50_percent: alert
    on_overrun_100_percent: halt

# ===== 工作流阶段 =====
stages:
  - id: gis-analysis
    name: 分析
    description: 把 docs/source/** 与 mds/** 资料按五层分层
    skill: skills/gis-analysis/SKILL.md
    entry_command: $gis-dev-workflow:gis-analysis
    order: 1
    prerequisites: []
    gate:
      type: artifact-with-review
      artifact: docs/analysis/01-五层索引目录.md
      review: user
    trust_level: L1_suggest
    timeout: 7200

  - id: gis-design
    name: 设计
    description: 产出七份设计文档
    skill: skills/gis-design/SKILL.md
    entry_command: $gis-dev-workflow:gis-design
    order: 2
    prerequisites: [gis-analysis]
    brainstorm_skill: superpowers:brainstorming
    gate:
      type: design-review
      artifacts:
        - docs/design/00-设计总览.md
        - docs/design/01-业务域设计.md
        - docs/design/02-协议层设计.md
        - docs/design/03-控制层设计.md
        - docs/design/04-渲染层设计.md
        - docs/design/05-状态机设计.md
        - docs/design/06-异常与降级设计.md
      review: user
    trust_level: L1_suggest
    timeout: 432000

  - id: gis-planning
    name: 计划
    description: 产出六份可执行计划
    skill: skills/gis-planning/SKILL.md
    entry_command: $gis-dev-workflow:gis-planning
    order: 3
    prerequisites: [gis-design]
    plan_skill: superpowers:writing-plans
    gate:
      type: plan-completeness
      artifacts:
        - docs/plan/00-计划总览.md
        - docs/plan/01-Service与Protocol层计划.md
        - docs/plan/02-Calc层计划.md
        - docs/plan/03-Ctrl业务控制层计划.md
        - docs/plan/04-Ctrl通用控制层计划.md
        - docs/plan/05-Ctrl-IO控制层与Render层计划.md
        - docs/plan/06-测试与验收计划.md
      forbidden_keywords: [TODO, TBD, 待补充, TBC]
    trust_level: L1_suggest
    timeout: 172800

  - id: gis-implementation
    name: 实现
    description: 按五层 + 集成顺序实现
    skill: skills/gis-implementation/SKILL.md
    entry_command: $gis-dev-workflow:gis-implementation
    order: 4
    prerequisites: [gis-planning]
    tdd_skill: superpowers:test-driven-development
    gates:
      - type: quality-gate
        commands:
          - pnpm type-check
          - pnpm lint
          - pnpm test
        coverage_threshold: 80
      - type: architecture-compliance
        rules:
          - 业务控制层不直接调 OpenLayers
          - 通用控制层不读业务 store
          - 业务 ID 必须加业务前缀
          - Auto-Fit Padding 必须保留 10-15%
      - type: anti-pattern-check
        file: references/anti-patterns.md
    trust_level: L2_confirm
    timeout: 864000

  - id: gis-test
    name: 测试
    description: 端到端 + 性能 + 综合评分
    skill: skills/gis-test/SKILL.md
    entry_command: $gis-dev-workflow:gis-test
    order: 5
    prerequisites: [gis-implementation]
    verification_skill: superpowers:verification-before-completion
    gates:
      - type: coverage
        threshold: 80
      - type: scenario-ac
        scenarios: [duty, incoming-call, inquiry, dispatch, tracking]
      - type: performance-sla
        rules:
          - frame_rate: ">= 30fps (P95)"
          - call_popup_latency: "<= 500ms"
          - route_planning: "<= 1s (P95)"
      - type: comprehensive-score
        threshold: 80
        rubric: docs/source/10-前端实现完整度评分规则.md
    artifact: tests/report/final-acceptance.md
    trust_level: L2_confirm
    timeout: 172800

# ===== 配套技能 =====
companions:
  - id: handover-doc
    name: 项目交接
    description: 任何阶段后可调用
    skill: skills/handover-doc/SKILL.md
    entry_command: $gis-dev-workflow:handover-doc
    artifact: docs/handover/<project-name>-交接文档.md
    trust_level: L1_suggest

# ===== 工具定义 =====
tools:
  - name: read_documentation
    description: 读取 docs/source/** 与 mds/** 文档
    parameters:
      type: object
      properties:
        path:
          type: string
        purpose:
          type: string
          enum: [analysis, design, planning, implementation, test, handover]
    permissions:
      - file:read

  - name: write_stage_artifact
    description: 写入阶段产物
    parameters:
      type: object
      properties:
        stage:
          type: string
          enum: [gis-analysis, gis-design, gis-planning, gis-implementation, gis-test]
        path:
          type: string
        content:
          type: string
        commit_message:
          type: string
    permissions:
      - file:write

  - name: run_quality_gate
    description: 运行工程质量门禁
    parameters:
      type: object
      properties:
        commands:
          type: array
          items:
            type: string
            enum: [type-check, lint, test, bench, build]
        fail_fast:
          type: boolean
        coverage_threshold:
          type: number
    permissions:
      - shell:execute

  - name: invoke_superpowers
    description: 调用 superpowers 配套技能
    parameters:
      type: object
      properties:
        skill:
          type: string
          enum:
            - superpowers:brainstorming
            - superpowers:writing-plans
            - superpowers:test-driven-development
            - superpowers:subagent-driven-development
            - superpowers:verification-before-completion
            - superpowers:requesting-code-review
    permissions:
      - skill:invoke

# ===== 上下文 =====
context:
  repository_root: d:/work/telewave/ids/ids-gis-web
  single_source_of_truth: docs/source/
  legacy_docs: mds/
  docs_source_count: 15
  baseline:
    framework: Vue 3.5+
    language: TypeScript 6.0+ (strict)
    build: Vite 8+ / pnpm
    state: Pinia 3+
    map: OpenLayers 10.2+
    three_d: ThreeJS 0.169+
    test: Vitest 2+ / @vue/test-utils 2+

# ===== 协同规约 =====
conventions:
  documents:
    - docs/source/** 是单一真相源
    - mds/** 是历史资料库，不再独立维护
    - 任何架构变更必须先在 docs/source/** 更新，再提交代码 MR
  code:
    - 业务控制层只装配业务参数
    - 通用控制层只执行图形指令
    - 严禁越层调用
  protocol:
    - 协议层字段变更必须升级 manifest.json 的 minor 版本
  testing:
    - 测试覆盖率 ≥ 80%
    - 综合评分 ≥ 80 分（B 良好及以上）方可发版
  anti_patterns:
    - 必须参考 references/anti-patterns.md（15 条反模式）
    - 触发任何反模式必须阻断 + 打点
    - 修复反模式必须先添加失败测试
  decision_trees:
    - 必须参考 references/decision-trees.md（8 棵决策树）
    - 阶段选择、异常处理、焦点裁决、信任校准均有决策路径

# ===== 硬约束 =====
hard_constraints:
  - id: coordinate-system
    rule: 坐标系强约束 WGS84
    violation_code: COORD_VIOLATION
  - id: business-id-prefix
    rule: 业务 ID 前缀（alarm_/call_/route_/plan_/vehicle_/trail_）
    violation_code: ID_PREFIX_MISSING
  - id: auto-fit-padding
    rule: Auto-Fit Padding 10-15%
    violation_code: PADDING_AUTO_FIX
  - id: state-machine-transition
    rule: 仅允许 docs/source/08-业务状态机定义.md 迁移表内的有向边
    violation_code: ILLEGAL_TRANSITION
  - id: focus-mutex
    rule: 同时仅一个业务域拥有焦点
    violation_code: FOCUS_CONFLICT
  - id: permission
    rule: 操作人权限必须满足角色权限矩阵
    violation_code: PERMISSION_DENIED

# ===== 异常处理 =====
exceptions:
  count: 14
  types:
    - COORD_VIOLATION
    - ILLEGAL_TRANSITION
    - ROUTE_FALLBACK
