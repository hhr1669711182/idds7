server {
    listen 80;
    server_name localhost;
    
    # 设置根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # 处理SPA路由
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ---------- 压缩 ----------
    # Element Plus 官方 dark 主题用的 GeoJSON 与 wasm 需显式声明，否则不压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/wasm
        application/xml
        image/svg+xml;

    # ---------- 缓存 ----------
    # 构建产物带内容哈希，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后能拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Cesium 静态资源版本随发布变动，不做长期缓存
    location /cesium/ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
}
